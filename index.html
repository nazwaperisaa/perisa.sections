<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon – Perisa’s Library</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#f6f1ea,#e9dfd3,#d8cbbd);
    font-family:'Poppins', sans-serif;
    overflow:hidden;
}

/* soft warm glow */
.glow{
    position:absolute;
    width:400px;
    height:400px;
    background:radial-gradient(circle, rgba(255,230,190,.45), transparent 70%);
    top:-120px;
    right:-120px;
    filter:blur(20px);
}
.glow.two{
    width:300px;
    height:300px;
    left:-80px;
    bottom:-80px;
}

/* subtle book shelf lines */
.bookshelf{
    position:absolute;
    bottom:0;
    width:100%;
    height:120px;
    background:
        repeating-linear-gradient(
            to right,
            rgba(160,130,90,.15) 0,
            rgba(160,130,90,.15) 14px,
            transparent 14px,
            transparent 24px
        );
    opacity:.4;
}

/* main card */
.container{
    position:relative;
    padding:65px 80px;
    border-radius:26px;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(10px);
    box-shadow:0 30px 55px rgba(120,90,50,.18);
    text-align:center;
    animation:fadeIn 1.6s ease;
    z-index:2;
}

@keyframes fadeIn{
    from{opacity:0; transform:translateY(28px);}
    to{opacity:1; transform:translateY(0);}
}

/* decor icons */
.decor{
    position:absolute;
    font-size:32px;
    opacity:.35;
}
.decor.one{top:-18px; left:-12px;}
.decor.two{bottom:-20px; right:-12px;}
.decor.three{top:-22px; right:38px; font-size:24px;}

/* title */
h1{
    font-family:'Playfair Display', serif;
    font-size:64px;
    margin:0;
    letter-spacing:2px;
    color:#5b4631;
}

.subtitle{
    margin-top:10px;
    font-size:13px;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#9b8468;
}

/* divider */
.divider{
    width:90px;
    height:2px;
    background:linear-gradient(to right, transparent, #9b8468, transparent);
    margin:28px auto;
}

/* text */
p{
    margin-top:0;
    font-size:16px;
    line-height:1.8;
    color:#6a5742;
}

/* countdown */
.countdown{
    display:flex;
    gap:18px;
    justify-content:center;
    margin-top:30px;
}

.time-box{
    background:rgba(255,255,255,.75);
    border-radius:14px;
    padding:12px 18px;
    min-width:80px;
    box-shadow:0 8px 16px rgba(0,0,0,.08);
}

.time-box span{
    display:block;
    font-size:26px;
    font-weight:500;
    color:#5b4631;
}

.time-box small{
    font-size:11px;
    letter-spacing:1px;
    color:#9b8468;
}
</style>
</head>

<body>

<div class="glow"></div>
<div class="glow two"></div>
<div class="bookshelf"></div>

<div class="container">
    <div class="decor one">📚</div>
    <div class="decor two">🤎</div>
    <div class="decor three">📖</div>

    <h1>Coming Soon</h1>
    <div class="subtitle">Nazwaperisa’s Library</div>

    <div class="divider"></div>

    <p>
         <b>Perisa's Library</b> still in the works.<br>
        Menemukan dunia dalam satu ruang.
    </p>

    <div class="countdown">
        <div class="time-box"><span id="days">00</span><small>DAYS</small></div>
        <div class="time-box"><span id="hours">00</span><small>HOURS</small></div>
        <div class="time-box"><span id="minutes">00</span><small>MINUTES</small></div>
        <div class="time-box"><span id="seconds">00</span><small>SECONDS</small></div>
    </div>
</div>

<script>
const launchDate=new Date("2026-03-01T00:00:00").getTime();
setInterval(()=>{
    const now=new Date().getTime();
    const d=launchDate-now;
    if(d<0)return;

    days.innerText=Math.floor(d/(1000*60*60*24));
    hours.innerText=Math.floor((d%(1000*60*60*24))/(1000*60*60));
    minutes.innerText=Math.floor((d%(1000*60*60))/(1000*60));
    seconds.innerText=Math.floor((d%(1000*60))/1000);
},1000);
</script>

</body>
</html>
