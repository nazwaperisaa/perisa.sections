<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Library Corner</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Inter',sans-serif}

body{
  background:linear-gradient(135deg,#f6f2ec,#e8ded2);
  color:#3f3329;
}

header{
  text-align:center;
  padding:60px 20px 40px;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:3rem;
}

.subtitle{
  font-size:13px;
  letter-spacing:2px;
  color:#7a6957;
  margin-top:10px;
  text-transform:uppercase;
}

.divider{
  width:90px;
  height:2px;
  background:linear-gradient(90deg,#d3b48c,#f1dfc3,#d3b48c);
  margin:25px auto 0;
  border-radius:20px;
}

.search-box{
  max-width:550px;
  margin:40px auto;
  display:flex;
  background:#fff;
  border-radius:50px;
  padding:6px 12px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.search-box input{
  flex:1;
  border:none;
  outline:none;
  padding:12px 15px;
  font-size:14px;
  border-radius:50px;
}

.search-box button{
  border:none;
  background:linear-gradient(135deg,#d6b892,#c3a77f);
  padding:10px 22px;
  border-radius:40px;
  color:#fff;
  font-size:13px;
  cursor:pointer;
}

section{
  padding:40px 8%;
}

h2{
  font-family:'Playfair Display',serif;
  margin-bottom:25px;
  font-size:2rem;
}

.books{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:25px;
}

.book{
  background:rgba(255,255,255,0.75);
  border-radius:16px;
  padding:20px;
  text-align:center;
  box-shadow:0 10px 25px rgba(0,0,0,0.07);
  transition:.4s ease;
}

.book:hover{
  transform:translateY(-6px);
}

.book h3{
  font-family:'Playfair Display',serif;
  font-size:1.1rem;
  margin-bottom:6px;
}

.book p{
  font-size:13px;
  color:#7a6957;
}

.video-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:25px;
}

iframe{
  width:100%;
  height:200px;
  border-radius:16px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

footer{
  text-align:center;
  padding:40px 20px;
  font-size:12px;
  color:#9c8a75;
}

/* Responsive */
@media(max-width:600px){
  h1{font-size:2.2rem;}
  section{padding:30px 6%;}
}
</style>
</head>
<body>

<header>
  <h1>Library Corner</h1>
  <p class="subtitle">modern • calm • classy</p>
  <div class="divider"></div>

  <div class="search-box">
    <input type="text" id="search" placeholder="Search book, topic, or author...">
    <button>Search</button>
  </div>
</header>

<section>
  <h2>Book Collection</h2>
  <div class="books" id="bookList">

    <div class="book">
      <h3>Atomic Habits</h3>
      <p>James Clear</p>
    </div>

    <div class="book">
      <h3>Filosofi Teras</h3>
      <p>Henry Manampiring</p>
    </div>

    <div class="book">
      <h3>The Psychology of Money</h3>
      <p>Morgan Housel</p>
    </div>

    <div class="book">
      <h3>Laut Bercerita</h3>
      <p>Leila S. Chudori</p>
    </div>

    <div class="book">
      <h3>Ikigai</h3>
      <p>Héctor García</p>
    </div>

  </div>
</section>

<section>
  <h2>Inspirational Videos</h2>
  <div class="video-grid">

    <iframe src="https://www.youtube.com/embed/ZXsQAXx_ao0" allowfullscreen></iframe>
   
  </div>
</section>

<footer>
  © 2026 — Library Corner · Calm Knowledge Space
</footer>

<script>
const search = document.getElementById("search");
const books = document.querySelectorAll(".book");

search.addEventListener("keyup", () => {
  const value = search.value.toLowerCase();
  books.forEach(book => {
    const text = book.innerText.toLowerCase();
    book.style.display = text.includes(value) ? "block" : "none";
  });
});
</script>

</body>
</html>
