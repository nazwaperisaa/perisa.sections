<!DOCTYPE html>
<html>
<head>
<title>Perpustakaan Digital</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{
    margin:0;
    font-family:Arial, sans-serif;
}

/* HEADER */
header{
    background:#800000;
    color:white;
    padding:15px 20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

header button{
    padding:7px 15px;
    border:none;
    background:white;
    color:#800000;
    cursor:pointer;
    border-radius:5px;
    font-weight:bold;
}

/* CONTENT */
.container{
    padding:20px;
}

/* SEARCH */
.search-box{
    margin:20px 0;
}

.search-box input{
    padding:8px;
    width:250px;
}

.search-box button{
    padding:8px 12px;
    background:#800000;
    color:white;
    border:none;
    cursor:pointer;
}

/* BOOK LIST */
.book{
    padding:10px;
    border-bottom:1px solid #ddd;
}

/* CONTACT US */
.contact{
    background:#a52a2a;
    padding:25px;
    color:white;
    margin-top:40px;
}

.contact h2{
    font-weight:bold;
}

.contact input,
.contact textarea{
    width:100%;
    padding:8px;
    margin-bottom:10px;
    border:none;
    border-radius:5px;
}

.contact button{
    padding:10px;
    background:white;
    color:#800000;
    border:none;
    font-weight:bold;
    cursor:pointer;
    border-radius:5px;
}

/* LOGIN MODAL */
#loginModal{
    display:none;
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.4);
    justify-content:center;
    align-items:center;
}

.modal-box{
    background:white;
    width:350px;
    padding:20px;
    border-radius:10px;
    position:relative;
    font-size:14px;
}

.modal-box input{
    width:100%;
    padding:6px;
    margin-bottom:8px;
}

.modal-box button{
    width:100%;
    padding:7px;
    background:#800000;
    color:white;
    border:none;
    cursor:pointer;
    border-radius:5px;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    cursor:pointer;
    font-weight:bold;
}
</style>
</head>

<body>

<header>
    <h3>Perpustakaan Digital</h3>
    <button id="loginBtn" onclick="openLogin()">Login</button>
</header>

<div class="container">

    <h2>Selamat Datang</h2>
    <p>Website ini menyediakan berbagai koleksi buku. Kamu tetap bisa melihat semua isi walaupun belum login.</p>

    <!-- SEARCH -->
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="Cari buku...">
        <button onclick="searchBook()">Cari</button>
    </div>

    <!-- BOOK LIST -->
    <div id="bookList">
        <div class="book">Laskar Pelangi</div>
        <div class="book">Bumi Manusia</div>
        <div class="book">Negeri 5 Menara</div>
        <div class="book">Ayat-Ayat Cinta</div>
    </div>

</div>

<!-- CONTACT US -->
<div class="contact">
    <h2>Contact Us</h2>
    <input type="text" placeholder="Nama">
    <input type="email" placeholder="Email">
    <textarea rows="4" placeholder="Tulis feedback kamu..."></textarea>
    <button>Kirim Feedback</button>
</div>

<!-- LOGIN MODAL -->
<div id="loginModal">
<div class="modal-box">

<span class="close" onclick="closeLogin()">×</span>

<div style="display:flex; gap:10px; margin-bottom:15px;">
<button onclick="showLogin()">Login</button>
<button onclick="showSignup()">Sign Up</button>
</div>

<!-- LOGIN -->
<div id="loginForm">
<input type="email" id="loginEmail" placeholder="Email">
<input type="password" id="loginPassword" placeholder="Password">
<button onclick="loginUser()">Login</button>
</div>

<!-- SIGN UP -->
<div id="signupForm" style="display:none;">
<input type="text" id="signupName" placeholder="Nama">
<input type="email" id="signupEmail" placeholder="Email">
<input type="password" id="signupPassword" placeholder="Password">
<input type="password" id="signupConfirm" placeholder="Masukkan kembali Password">
<button onclick="registerUser()">Sign Up</button>
</div>

</div>
</div>

<script>

/* SEARCH */
function searchBook(){
    let input = document.getElementById("searchInput").value.toLowerCase();
    let books = document.getElementsByClassName("book");

    for(let i=0; i<books.length; i++){
        let text = books[i].innerText.toLowerCase();
        books[i].style.display = text.includes(input) ? "block" : "none";
    }
}

/* LOGIN SYSTEM */
function openLogin(){
    document.getElementById("loginModal").style.display="flex";
}

function closeLogin(){
    document.getElementById("loginModal").style.display="none";
}

function showLogin(){
    document.getElementById("loginForm").style.display="block";
    document.getElementById("signupForm").style.display="none";
}

function showSignup(){
    document.getElementById("loginForm").style.display="none";
    document.getElementById("signupForm").style.display="block";
}

function registerUser(){
    let name = document.getElementById("signupName").value;
    let email = document.getElementById("signupEmail").value;
    let pass = document.getElementById("signupPassword").value;
    let confirm = document.getElementById("signupConfirm").value;

    if(!name || !email || !pass){
        alert("Semua data wajib diisi");
        return;
    }

    if(pass !== confirm){
        alert("Password tidak cocok");
        return;
    }

    localStorage.setItem("userName", name);
    localStorage.setItem("userEmail", email);
    localStorage.setItem("userPassword", pass);

    alert("Berhasil daftar! Silakan login");
    showLogin();
}

function loginUser(){
    let email = document.getElementById("loginEmail").value;
    let pass = document.getElementById("loginPassword").value;

    let savedEmail = localStorage.getItem("userEmail");
    let savedPass = localStorage.getItem("userPassword");
    let savedName = localStorage.getItem("userName");

    if(email === savedEmail && pass === savedPass){
        document.getElementById("loginBtn").innerText = "Hi, " + savedName;
        closeLogin();
    } else {
        alert("Email atau password salah");
    }
}

</script>

</body>
</html>
