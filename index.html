<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perisa's Library</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Poppins', sans-serif;}

body{
    margin:0;
    background:linear-gradient(135deg,#5a0f18,#f6eee6);
    color:#3a1b1f;
}

/* HEADER */
header{
    background:linear-gradient(90deg,#4b0f16,#7a1b26);
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-family:'Playfair Display', serif;
    font-size:30px;
    font-weight:700;
    background:linear-gradient(90deg,#f6eee6,#7a1b26);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

nav a{
    margin-left:25px;
    text-decoration:none;
    color:#f6eee6;
    font-weight:500;
    cursor:pointer;
}

.login-btn{
    padding:8px 16px;
    border-radius:20px;
    background:#f6eee6;
    color:#7a1b26;
    font-weight:600;
}

/* MODAL LOGIN */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-box{
    background:linear-gradient(135deg,#fff,#f6eee6);
    padding:30px 35px;
    border-radius:18px;
    width:100%;
    max-width:420px;
    box-shadow:0 15px 45px rgba(0,0,0,0.35);
}

.modal-box h2{
    margin-top:0;
    text-align:center;
    font-family:'Playfair Display', serif;
}

.form-group{margin-bottom:14px;}

.form-group label{
    font-size:13px;
    font-weight:600;
}

.form-group input{
    width:100%;
    padding:11px 12px;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
}

.modal-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#7a1b26,#4b0f16);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

.close-btn{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    cursor:pointer;
    color:#7a1b26;
}

/* SECTION */
section{padding:90px 12%;}

.hero{
    display:flex;
    align-items:center;
    gap:60px;
    flex-wrap:wrap;
}

.hero-text h1{
    font-family:'Playfair Display', serif;
    font-size:52px;
    background:linear-gradient(90deg,#f6eee6,#7a1b26);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero-text p{line-height:1.9;}

/* ABOUT */
.about{text-align:center;}

.about img{
    width:260px;
    height:260px;
    object-fit:cover;
    border-radius:20px;
    padding:6px;
    background:linear-gradient(135deg,#7a1b26,#f6eee6);
}

/* COLLECTION */
.search-box{
    max-width:500px;
    margin:0 auto 35px;
}

.search-box input{
    width:100%;
    padding:14px 18px;
    border-radius:12px;
    border:none;
}

.book-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:25px;
}

.book{
    background:rgba(255,255,255,0.55);
    border-radius:14px;
    padding:15px;
    text-align:center;
}

/* MEDIA */
.media-links{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:25px;
    max-width:550px;
    margin:0 auto;
}

/* VIDEO */
.video iframe{
    width:100%;
    max-width:720px;
    height:400px;
    border-radius:16px;
    display:block;
    margin:0 auto;
}

/* CONTACT */
.contact{
    text-align:center;
    background:linear-gradient(135deg,#7a1b26,#4b0f16);
    color:#f6eee6;
    border-radius:35px 35px 0 0;
}

.feedback-box{
    max-width:560px;
    margin:40px auto 0;
    background:rgba(255,255,255,0.95);
    padding:35px;
    border-radius:18px;
    box-shadow:0 15px 40px rgba(0,0,0,0.35);
}

.feedback-box label{
    font-weight:600;
    font-size:14px;
    color:#4b0f16;
}

.feedback-box input,
.feedback-box textarea{
    width:100%;
    padding:12px 14px;
    border-radius:12px;
    border:1px solid #ccc;
    font-weight:500;
}

.feedback-box button{
    width:100%;
    margin-top:12px;
    padding:12px;
    border:none;
    border-radius:14px;
    background:linear-gradient(90deg,#7a1b26,#4b0f16);
    color:#fff;
    font-weight:600;
}

/* FOOTER */
footer{
    background:#4b0f16;
    text-align:center;
    padding:18px;
    color:#f6eee6;
}

@media(max-width:900px){
    header{padding:18px 25px;}
    section{padding:70px 8%;}
}
</style>
</head>

<body>

<header>
    <div class="logo">Perisa's Library</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#collection">Collection</a>
        <a href="#media">Media</a>
        <a href="#contact">Contact</a>
        <a class="login-btn" id="loginBtn" onclick="openLogin()">Login</a>
    </nav>
</header>

<!-- LOGIN MODAL -->
<div class="modal" id="loginModal">
    <div class="modal-box">
        <h2>Login</h2>

        <div class="form-group">
            <label>First Name</label>
            <input type="text" id="fname">
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" id="lname">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email">
        </div>

        <div class="form-group">
            <label>Nomor Telepon</label>
            <input type="tel" id="phone">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password">
        </div>

        <button onclick="saveLogin()">Masuk</button>
        <div class="close-btn" onclick="closeLogin()">Tutup</div>
    </div>
</div>

<!-- HERO -->
<section id="home" class="hero">
    <div class="hero-text">
        <h1>Perisa's Library</h1>
        <p>Sebuah ruang literasi digital untuk berbagi dokumentasi akademik dan eksplorasi ide.</p>
    </div>
</section>

<!-- CONTACT -->
<section id="contact" class="contact">
    <h2 style="font-family:'Playfair Display', serif;">Contact Us</h2>
    <p style="font-weight:600;">Kami sangat menghargai kritik, saran, dan pesan dari kamu 💬</p>

    <div class="feedback-box">
        <div class="form-group">
            <label>Nama</label>
            <input type="text" id="fbName">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="fbEmail">
        </div>

        <div class="form-group">
            <label>Pesan / Feedback</label>
            <textarea rows="4" id="fbMsg"></textarea>
        </div>

        <button onclick="sendFeedback()">Kirim Pesan</button>
    </div>
</section>

<footer>
    © 2026 Perisa’s Library
</footer>

<script>
function openLogin(){
    document.getElementById("loginModal").style.display="flex";
}

function closeLogin(){
    document.getElementById("loginModal").style.display="none";
}

function saveLogin(){
    let fname = document.getElementById("fname").value;
    if(fname===""){alert("Isi nama depan dulu ya 😊"); return;}
    localStorage.setItem("username", fname);
    document.getElementById("loginBtn").innerText="Hi, "+fname+" 👋";
    closeLogin();
}

window.onload = function(){
    let name = localStorage.getItem("username");
    if(name){
        document.getElementById("loginBtn").innerText="Hi, "+name+" 👋";
    }
}

function sendFeedback(){
    let name = document.getElementById("fbName").value;
    let msg = document.getElementById("fbMsg").value;

    if(name==="" || msg===""){
        alert("Nama dan pesan wajib diisi ya 😊");
        return;
    }

    alert("Terima kasih atas feedback-nya 💖");
    document.getElementById("fbName").value="";
    document.getElementById("fbEmail").value="";
    document.getElementById("fbMsg").value="";
}
</script>

</body>
</html>
