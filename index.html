<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perisa's Library</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Poppins', sans-serif;}

body{
    margin:0;
    background:linear-gradient(135deg,#5a0f18,#f6eee6);
    color:#3a1b1f;
}

header{
    background:linear-gradient(90deg,#4b0f16,#7a1b26);
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-family:'Playfair Display', serif;
    font-size:30px;
    font-weight:700;
    background:linear-gradient(90deg,#f6eee6,#7a1b26);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

nav a{
    margin-left:22px;
    text-decoration:none;
    color:#f6eee6;
    font-weight:500;
    cursor:pointer;
}

.login-btn{
    padding:8px 16px;
    border-radius:20px;
    background:#f6eee6;
    color:#7a1b26;
    font-weight:600;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-box{
    background:linear-gradient(135deg,#fff,#f6eee6);
    padding:30px 35px;
    border-radius:18px;
    width:100%;
    max-width:420px;
    box-shadow:0 15px 45px rgba(0,0,0,0.35);
    animation:scaleUp .35s ease;
}

@keyframes scaleUp{
    from{transform:scale(.8);opacity:0}
    to{transform:scale(1);opacity:1}
}

.modal-box h2{
    margin-top:0;
    text-align:center;
    font-family:'Playfair Display', serif;
}

.form-group{
    margin-bottom:14px;
}

.form-group label{
    font-size:13px;
    font-weight:500;
}

.form-group input{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
}

.form-group input:focus{
    border-color:#7a1b26;
}

.modal-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#7a1b26,#4b0f16);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

.close-btn{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    cursor:pointer;
    color:#7a1b26;
}

section{padding:90px 12%;}

.hero{
    display:flex;
    align-items:center;
    gap:60px;
    flex-wrap:wrap;
}

.hero-text{flex:1;}
.hero-text h1{
    font-family:'Playfair Display', serif;
    font-size:52px;
    background:linear-gradient(90deg,#f6eee6,#7a1b26);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero-text p{line-height:1.9;}

.hero-img{flex:1;}
.hero-img img{
    width:100%;
    border-radius:14px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

.about{text-align:center;}

.about img{
    width:260px;
    height:260px;
    object-fit:cover;
    border-radius:20px;
    padding:6px;
    background:linear-gradient(135deg,#7a1b26,#f6eee6);
    box-shadow:0 0 20px rgba(122,27,38,.6);
}

footer{
    background:#4b0f16;
    text-align:center;
    padding:18px;
    color:#f6eee6;
}

@media(max-width:900px){
    header{padding:18px 25px;}
    section{padding:70px 8%;}
    .hero{flex-direction:column-reverse;text-align:center;}
}
</style>
</head>

<body>

<header>
    <div class="logo">Perisa's Library</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#collection">Collection</a>
        <a href="#media">Media</a>
        <a class="login-btn" onclick="openLogin()">Login</a>
    </nav>
</header>

<div class="modal" id="loginModal">
    <div class="modal-box">
        <h2>Login</h2>

        <div class="form-group">
            <label>First Name</label>
            <input type="text" placeholder="Masukkan nama depan">
        </div>

        <div class="form-group">
            <label>Last Name</label>
            <input type="text" placeholder="Masukkan nama belakang">
        </div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" placeholder="Masukkan email">
        </div>

        <div class="form-group">
            <label>Nomor Telepon</label>
            <input type="tel" placeholder="Masukkan nomor telepon">
        </div>

        <button>Login</button>
        <div class="close-btn" onclick="closeLogin()">Tutup</div>
    </div>
</div>

<section id="home" class="hero">
    <div class="hero-text">
        <h1>Perisa's Library</h1>
        <p>
            Sebuah ruang literasi digital yang bisa jadi tempat berbagi dokumentasi akademik, 
            refleksi personal, serta eksplorasi ide dan pengetahuan.
        </p>
    </div>
    <div class="hero-img">
        <img src="https://images.unsplash.com/photo-1507842217343-583bb7270b66">
    </div>
</section>

<footer>
    © 2026 Perisa’s Library
</footer>

<script>
function openLogin(){
    document.getElementById("loginModal").style.display="flex";
}
function closeLogin(){
    document.getElementById("loginModal").style.display="none";
}
</script>

</body>
</html>
