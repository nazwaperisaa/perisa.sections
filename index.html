<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perisa's Library</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;font-family:'Poppins', sans-serif;scroll-behavior:smooth;}

body{
    margin:0;
    background:linear-gradient(135deg,#5a0f18,#f6eee6);
    color:#3a1b1f;
}

/* HEADER */
header{
    background:linear-gradient(90deg,#4b0f16,#7a1b26);
    padding:20px 60px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-family:'Playfair Display', serif;
    font-size:30px;
    font-weight:700;
    background:linear-gradient(90deg,#f6eee6,#7a1b26);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

nav a{
    margin-left:25px;
    text-decoration:none;
    color:#f6eee6;
    font-weight:500;
    cursor:pointer;
}

.login-btn{
    padding:8px 16px;
    border-radius:20px;
    background:#f6eee6;
    color:#7a1b26;
    font-weight:600;
    cursor:pointer;
}

/* MODAL */
.modal{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.55);
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-box{
    background:linear-gradient(135deg,#fff,#f6eee6);
    padding:30px 35px;
    border-radius:18px;
    width:100%;
    max-width:420px;
    box-shadow:0 15px 45px rgba(0,0,0,0.35);
}

.modal-box h2{
    margin-top:0;
    text-align:center;
    font-family:'Playfair Display', serif;
}

/* TAB MENU */
.tab-menu{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-bottom:15px;
    font-weight:600;
    cursor:pointer;
}

.tab-menu span{
    padding-bottom:5px;
}

.active-tab{
    border-bottom:2px solid #7a1b26;
    color:#7a1b26;
}

.form-group{margin-bottom:14px;}

.form-group label{
    font-size:13px;
    font-weight:500;
}

.form-group input{
    width:100%;
    padding:10px 12px;
    border-radius:10px;
    border:1px solid #ccc;
    outline:none;
}

.modal-box button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:12px;
    background:linear-gradient(90deg,#7a1b26,#4b0f16);
    color:#fff;
    font-weight:600;
    cursor:pointer;
    margin-top:10px;
}

.close-btn{
    text-align:center;
    margin-top:10px;
    font-size:13px;
    cursor:pointer;
    color:#7a1b26;
}

/* SECTION */
section{padding:90px 12%;}

/* HERO */
.hero{
    display:flex;
    align-items:center;
    gap:60px;
    flex-wrap:wrap;
}

.hero-text{flex:1;}

.hero-text h1{
    font-family:'Playfair Display', serif;
    font-size:52px;
    background:linear-gradient(90deg,#f6eee6,#7a1b26);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.hero-text p{line-height:1.9;}

.hero-img{flex:1;}

.hero-img img{
    width:100%;
    border-radius:14px;
    box-shadow:0 15px 40px rgba(0,0,0,0.25);
}

/* ABOUT */
.about{text-align:center;}

/* PROFILE */
.profile{text-align:center;}

.profile-box{
    max-width:750px;
    margin:30px auto;
    background:rgba(255,255,255,0.6);
    padding:35px;
    border-radius:25px;
    box-shadow:0 12px 30px rgba(0,0,0,0.2);
}

/* COLLECTION */
.search-box{
    max-width:500px;
    margin:0 auto 35px;
}

.search-box input{
    width:100%;
    padding:14px 18px;
    border-radius:12px;
    border:none;
    outline:none;
}

.book-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(160px,1fr));
    gap:25px;
}

.book{
    background:rgba(255,255,255,0.55);
    border-radius:14px;
    padding:15px;
    text-align:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.18);
}

.book img{
    width:100%;
    border-radius:10px;
    margin-bottom:12px;
}

/* CONTACT */
.contact{text-align:center;}

.feedback-box{
    max-width:520px;
    margin:40px auto 0;
    background:linear-gradient(135deg,#7a1b26,#4b0f16);
    padding:35px;
    border-radius:50px;
    box-shadow:0 12px 35px rgba(0,0,0,0.3);
    color:#fff;
}

.feedback-box input{
    width:100%;
    padding:14px 20px;
    border-radius:40px;
    border:none;
    outline:none;
    margin-bottom:15px;
}

.feedback-box textarea{
    width:100%;
    padding:20px;
    border-radius:100px;
    border:none;
    outline:none;
    resize:none;
    margin-bottom:18px;
}

.feedback-box button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:40px;
    background:#f6eee6;
    color:#7a1b26;
    font-weight:600;
    cursor:pointer;
}

footer{
    background:#4b0f16;
    text-align:center;
    padding:18px;
    color:#f6eee6;
    font-size:14px;
}
</style>
</head>

<body>

<header>
    <div class="logo">Perisa's Library</div>
    <nav>
        <a href="#home">Home</a>
        <a href="#about">About</a>
        <a href="#profile">Profile</a>
        <a href="#collection">Collection</a>
        <a href="#contact">Contact</a>
        <span class="login-btn" id="loginBtn" onclick="openLogin()">Login</span>
    </nav>
</header>

<!-- LOGIN & SIGNUP MODAL -->
<div class="modal" id="loginModal">
    <div class="modal-box">

        <div class="tab-menu">
            <span id="loginTab" onclick="showLogin()" class="active-tab">Login</span>
            <span id="signupTab" onclick="showSignup()">Sign Up</span>
        </div>

        <div id="loginForm">
            <h2>Login</h2>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword">
            </div>
            <button onclick="loginUser()">Masuk</button>
        </div>

        <div id="signupForm" style="display:none;">
            <h2>Sign Up</h2>
            <div class="form-group">
                <label>Nama</label>
                <input type="text" id="signupName">
            </div>
            <div class="form-group">
                <label>Email</label>
                <input type="email" id="signupEmail">
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="signupPassword">
            </div>
            <div class="form-group">
                <label>Masukkan Kembali Password</label>
                <input type="password" id="signupConfirm">
            </div>
            <button onclick="registerUser()">Daftar</button>
        </div>

        <div class="close-btn" onclick="closeLogin()">Tutup</div>
    </div>
</div>

<script>
function openLogin(){ document.getElementById("loginModal").style.display="flex"; }
function closeLogin(){ document.getElementById("loginModal").style.display="none"; }

function showLogin(){
    loginForm.style.display="block";
    signupForm.style.display="none";
    loginTab.classList.add("active-tab");
    signupTab.classList.remove("active-tab");
}

function showSignup(){
    loginForm.style.display="none";
    signupForm.style.display="block";
    signupTab.classList.add("active-tab");
    loginTab.classList.remove("active-tab");
}

function registerUser(){
    let name=signupName.value;
    let email=signupEmail.value;
    let pass=signupPassword.value;
    let confirm=signupConfirm.value;

    if(!name||!email||!pass){ alert("Semua data wajib diisi"); return; }
    if(pass!==confirm){ alert("Password tidak cocok!"); return; }

    localStorage.setItem("userName",name);
    localStorage.setItem("userEmail",email);
    localStorage.setItem("userPassword",pass);

    alert("Berhasil daftar! Silakan login");
    showLogin();
}

function loginUser(){
    let email=loginEmail.value;
    let pass=loginPassword.value;

    if(email===localStorage.getItem("userEmail") &&
       pass===localStorage.getItem("userPassword")){
        loginBtn.innerText="Hi, "+localStorage.getItem("userName")+" 👋";
        localStorage.setItem("username",localStorage.getItem("userName"));
        closeLogin();
    } else {
        alert("Email atau password salah!");
    }
}

window.onload=function(){
    let name=localStorage.getItem("username");
    if(name){ loginBtn.innerText="Hi, "+name+" 👋"; }
}
</script>

</body>
</html>
